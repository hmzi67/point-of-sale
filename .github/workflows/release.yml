# Builds production artifacts for Windows, macOS (Apple Silicon + Intel) and
# Android whenever a `v*` tag is pushed, and collects them all onto a single
# GitHub release for that tag.
#
# iOS is intentionally out of scope — see PROJECT_GOALS.md / BUILD_PLAN.md.
#
# ---------------------------------------------------------------------------
# VERSION PINS THAT NEED PERIODIC VERIFICATION
# ---------------------------------------------------------------------------
# The versions below were checked against this repo's installed
# `@tauri-apps/cli` (see package.json) at the time this workflow was written.
# Tauri's Android tooling requirements (JDK, NDK) change between releases —
# re-check https://v2.tauri.app/start/prerequisites/#android and
# https://github.com/tauri-apps/tauri-action/releases before assuming these
# are still correct, especially after bumping @tauri-apps/cli:
#   - tauri-apps/tauri-action@v1   (added Android build support in 1.0.0)
#   - JDK 17 (Zulu)                 — standard for current Android Gradle Plugin
#   - Android NDK r27c              — pinned via nttld/setup-ndk; the repo's
#                                      generated src-tauri/gen/android project
#                                      does not itself pin an NDK version
#   - android-actions/setup-android@v4
#
# actions/checkout, actions/setup-node, actions/github-script and
# actions/setup-java are pinned to the earliest major of each that runs on
# Node 24 (checked 2026-08-26 — @v4/@v4/@v7/@v4 were still Node 20, which is
# what the "Node 20 is being deprecated" warning in run logs was about;
# Node 20 support is fully removed 2026-09-16). tauri-apps/tauri-action,
# nttld/setup-ndk and android-actions/setup-android were already Node 24 at
# their currently-pinned major and needed no change.
# ---------------------------------------------------------------------------

name: Release

on:
  push:
    tags:
      - "v*"

# Re-pushing the same tag queues behind any run already in progress for it,
# instead of racing duplicate builds / duplicate release uploads.
#
# cancel-in-progress is deliberately FALSE here, unlike a typical PR-CI
# workflow. This is a release build: each platform job is a 10-45 minute
# Rust compile, and killing one mid-build to start an identical rebuild from
# scratch is pure waste, not a time-save — for a run that's already most of
# the way done, cancelling it and starting over is strictly slower than
# just letting it finish. (This was diagnosed directly: a re-push of the
# same tag on 2026-08-26 cancelled a Windows build ~600 lines into `cargo
# build`, seconds before a second run for the same ref started — with
# cancel-in-progress true, that pattern repeats every time a tag is
# re-pushed to work around a release conflict.) With it false, a re-push
# still can't produce duplicate/racing uploads to the same release (the
# queued run simply runs after, and create-release's find-or-create logic
# reuses the same draft either way) — it just no longer destroys work in
# progress to do it. A run that's genuinely stuck is still bounded by each
# job's timeout-minutes below, and can always be cancelled by hand from the
# Actions UI if needed.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  # actions/checkout leaves github.ref_name populated with the bare tag
  # (e.g. "v1.0.0") for a tag push — used as both the release tag and name.
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  # Creates the (draft) GitHub release once, up front, so the Windows,
  # macOS and Android jobs all upload their artifacts onto the SAME
  # release instead of each creating their own.
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
    steps:
      # Idempotent: a re-run of this workflow for a tag that already has a
      # release (the platform jobs failed/were re-run after the release was
      # already created, or already published) must reuse that release
      # rather than creating a second one for the same tag_name. GitHub
      # allows a second *draft* to be created against an already-released
      # tag_name (drafts aren't tied to the tag until published), so without
      # this check `create-release` would silently succeed here and only
      # blow up later, in `finalize-release`, with a confusing
      # "already_exists" error when trying to undraft it.
      - name: Find or create release for this tag
        id: create-release
        uses: actions/github-script@v8
        with:
          script: |
            try {
              const { data } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: process.env.RELEASE_TAG,
              });
              core.info(`Reusing existing release ${data.id} for tag ${process.env.RELEASE_TAG} (draft=${data.draft})`);
              return data.id;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: process.env.RELEASE_TAG,
              name: `Diwan ${process.env.RELEASE_TAG}`,
              draft: true,
              prerelease: false,
            });
            return data.id;

  windows:
    name: Build Windows
    needs: create-release
    runs-on: windows-latest
    # Observed cold-build time (no Rust cache) is ~9-11 minutes end-to-end
    # for this job; with Swatinem/rust-cache warm, expect roughly half
    # that. 45 minutes gives real headroom over both without masking a
    # genuinely stuck build behind an ambiguous cancellation.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # Caches ~/.cargo and src-tauri/target keyed on Cargo.lock, so a
      # release rebuild doesn't recompile every dependency from scratch —
      # see the concurrency comment above for why builds staying fast also
      # shrinks the window a re-pushed tag can clash in.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          cache-on-failure: true

      - name: Install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}

  macos:
    name: Build macOS (${{ matrix.target }})
    needs: create-release
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    # Observed cold-build time is ~5-6 minutes per target; with the Rust
    # cache warm this should drop further. 30 minutes gives headroom
    # without masking a stuck build as an ambiguous cancellation.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Keyed by matrix.target too: both matrix jobs share the job id
      # ("macos"), and without an explicit extra key Swatinem/rust-cache
      # would key them the same despite compiling for different targets.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          key: ${{ matrix.target }}
          cache-on-failure: true

      - name: Install frontend dependencies
        run: npm ci

      # ---------------------------------------------------------------
      # Code signing / notarization — NOT yet configured (no Apple
      # Developer account). When one is available, this is the small
      # addition needed (no rewrite of the job):
      #
      #   - name: Import Apple signing certificate
      #     uses: apple-actions/import-codesign-certs@v3
      #     with:
      #       p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
      #       p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      #
      # ...placed before the tauri-action step below, and these env vars
      # added to that step (tauri-action / tauri-bundler read them
      # directly):
      #
      #   APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      #   APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      #   APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      #   APPLE_ID: ${{ secrets.APPLE_ID }}
      #   APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      #   APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      #
      # See https://v2.tauri.app/distribute/sign/macos/ for the full setup.
      # ---------------------------------------------------------------
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }}
          releaseId: ${{ needs.create-release.outputs.release_id }}

  android:
    name: Build Android
    needs: create-release
    runs-on: ubuntu-latest
    # Re-enabled: the two bugs that broke this build are fixed —
    # `reveal_main_window` in src-tauri/src/lib.rs was calling
    # desktop-only WebviewWindow methods (unminimize/center) unconditionally,
    # which doesn't compile for the Android target; and
    # scripts/patch_android_signing.py's signingConfigs block wasn't
    # guarded by the same keystorePropertiesFile.exists() check as the
    # property load above it. Both confirmed fixed with a real local
    # `tauri android build` (see git log for the fix commits).
    #
    # Untested cold-build estimate in CI specifically (four Rust targets +
    # Gradle + NDK) — a local single-target debug build took ~12 minutes;
    # revisit this timeout if a real CI run needs adjusting.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: >-
            aarch64-linux-android,
            armv7-linux-androideabi,
            i686-linux-android,
            x86_64-linux-android

      # Four targets share the job id ("android"); key on the target list
      # so this doesn't collide with a future per-target matrix split the
      # same way the macOS job's cache does.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          cache-on-failure: true

      # VERIFY: JDK version required by this repo's @tauri-apps/cli — see
      # the pin notes at the top of this file.
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"

      # VERIFY: Android SDK platform/build-tools versions. compileSdk/
      # targetSdk (currently 36) come from src-tauri/gen/android — Gradle
      # will pull any additional SDK packages it needs on top of this
      # baseline as long as licenses are pre-accepted, which this action
      # does.
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      # VERIFY: NDK version — not pinned anywhere in the repo (see pin
      # notes at the top of this file).
      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          link-to-sdk: true

      - name: Install frontend dependencies
        run: npm ci

      # src-tauri/gen/android is generated output (see the repo's git
      # status — it's untracked). Regenerate it if it isn't already
      # present so this job doesn't depend on it being committed.
      - name: Initialize Android project (if needed)
        run: test -d src-tauri/gen/android || npm run tauri android init

      # `tauri android init` regenerates build.gradle.kts from scratch every
      # run, and the generated file does NOT read keystore.properties or
      # apply a signing config to the release build type on its own — see
      # https://v2.tauri.app/distribute/sign/android/. Without this, the
      # keystore.properties written by the next step is inert and the build
      # silently produces an unsigned APK/AAB. scripts/patch_android_signing.py
      # is idempotent (safe to re-run) and is the same script a developer
      # runs locally after `npm run tauri android init` — see DEPLOYMENT.md.
      - name: Patch Android Gradle project to use keystore.properties
        run: python3 scripts/patch_android_signing.py

      # Tauri's Android signing reads src-tauri/gen/android/keystore.properties
      # (see https://v2.tauri.app/distribute/sign/android/). The documented
      # format uses a single `password` field for the keystore; `keyPassword`
      # is written defensively in case the key password differs from the
      # store password — VERIFY against your @tauri-apps/cli version whether
      # it's honored, since Tauri's own CI example only uses one password.
      # This step never logs the decoded keystore or password values.
      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/pos-release.keystore.jks"
          base64 --decode <<< "$ANDROID_KEYSTORE_BASE64" > "$KEYSTORE_PATH"
          {
            echo "storeFile=$KEYSTORE_PATH"
            echo "password=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > src-tauri/gen/android/keystore.properties
          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build signed Android app
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: npm run tauri android build -- --apk --aab

      # Regression guard: if the Gradle signing patch above ever stops
      # applying (Tauri changes the generated file's shape, the marker
      # comment stops matching, etc.), Gradle silently falls back to
      # producing e.g. app-universal-release-unsigned.apk instead of
      # failing the build. Fail loudly here instead of shipping an
      # unsigned artifact under a release named "signed".
      - name: Verify build outputs are signed
        run: |
          shopt -s globstar nullglob
          FILES=(src-tauri/gen/android/app/build/outputs/**/*.apk src-tauri/gen/android/app/build/outputs/**/*.aab)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No APK/AAB files found under src-tauri/gen/android/app/build/outputs" >&2
            exit 1
          fi
          UNSIGNED=()
          for f in "${FILES[@]}"; do
            case "$f" in
              *unsigned*) UNSIGNED+=("$f") ;;
            esac
          done
          if [ ${#UNSIGNED[@]} -ne 0 ]; then
            echo "error: found unsigned build output(s) — the signing config was not applied:" >&2
            printf '  %s\n' "${UNSIGNED[@]}" >&2
            exit 1
          fi
          echo "All build outputs are signed:"
          printf '  %s\n' "${FILES[@]}"

      - name: Remove decoded keystore
        if: always()
        run: rm -f "$KEYSTORE_PATH" src-tauri/gen/android/keystore.properties

      - name: Upload Android artifacts to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s globstar nullglob
          FILES=(src-tauri/gen/android/app/build/outputs/**/*.apk src-tauri/gen/android/app/build/outputs/**/*.aab)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No APK/AAB files found under src-tauri/gen/android/app/build/outputs" >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${FILES[@]}" --clobber --repo "${{ github.repository }}"

  # Only flip the release out of draft once every platform's artifacts have
  # actually landed on it, so the release page never shows an incomplete set.
  finalize-release:
    name: Publish release
    needs: [create-release, windows, macos, android]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Undraft release
        uses: actions/github-script@v8
        with:
          script: |
            const release_id = ${{ needs.create-release.outputs.release_id }};

            // A re-run of this job (e.g. only a platform job needed
            // re-running) can land here after a previous run already
            // published this same release — publishing again would send
            // GitHub the same PATCH and, because the tag is now attached to
            // a published release, it comes back as a 422 "already_exists"
            // on tag_name instead of a harmless no-op. Skip it outright
            // when it's already published.
            const { data: current } = await github.rest.repos.getRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id,
            });
            if (!current.draft) {
              core.info(`Release ${release_id} is already published — nothing to do.`);
              return;
            }

            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id,
              draft: false,
            });
