[package]
name = "tauri-app"
version = "1.0.0"
description = "Offline-first, module-configurable point of sale for retail and restaurant shops"
authors = ["Applr"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
argon2 = { version = "0.5", features = ["std"] }
base64 = "0.22"
csv = "1"
tauri-plugin-os = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

# Desktop printer transport: USB. Platform-gated out of the Android build
# entirely (not just cfg'd off at the call site) — raw libusb was never
# designed for Android's USB-permission model, and a previous attempt to
# call it from the Android build crashed the whole app natively (a libusb
# fault, not a catchable Rust panic — see printer/android_bt.rs's doc
# comment for the Android-side replacement). "vendored" builds libusb from
# source instead of requiring it preinstalled on the dev/client machine
# (e.g. `brew install libusb` on macOS).
#
# `rfd` (the fatal-startup-error dialog in `lib.rs`) is desktop-only for a
# different reason: it has no backend implementation at all for Android —
# `FileDialogImpl`/`MessageDialogImpl` simply aren't implemented for that
# target, a hard compile error, not a runtime one. `lib.rs`'s `run()` falls
# back to logging via `eprintln!` (reaches `adb logcat`) on Android instead.
[target.'cfg(not(target_os = "android"))'.dependencies]
rusb = { version = "0.9", features = ["vendored"] }
rfd = "0.16"

# Android printer transport: Bluetooth Classic (SPP), via direct JNI calls
# to the framework's own android.bluetooth classes — see
# printer/android_bt.rs's doc comment for how it gets a JavaVM/Context
# without any cooperation from Tauri/tao (their own JNI plumbing is
# `pub(crate)`-sealed, and `ndk-context` — the usual mechanism for this in a
# winit-family app — turned out not to be initialized in this Tauri version's
# Android runtime at all). `jni` is pinned to the version already in the
# dependency tree (pulled in transitively by tauri's Android runtime) so
# this doesn't drag in a second copy.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
