[package]
name = "tauri-app"
version = "1.0.0"
description = "Offline-first, module-configurable point of sale for retail and restaurant shops"
authors = ["Applr"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
argon2 = { version = "0.5", features = ["std"] }
base64 = "0.22"
csv = "1"
# USB transport for `printer::escpos::send_to_printer`. "vendored" builds
# libusb from source instead of requiring it preinstalled on the dev/client
# machine (e.g. `brew install libusb` on macOS) — one less setup step for a
# feature that's meant to just work once a USB thermal printer is plugged in.
rusb = { version = "0.9", features = ["vendored"] }
