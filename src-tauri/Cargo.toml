[package]
name = "tauri-app"
version = "1.0.0"
description = "Offline-first, module-configurable point of sale for retail and restaurant shops"
authors = ["Hamza Waheed"]
license = "MIT"
publish = false
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
argon2 = { version = "0.5", features = ["std"] }
base64 = "0.22"
csv = "1"
tauri-plugin-os = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# Licence-status signature verification (`license::verify`). The app only
# ever VERIFIES: the server signs with a private key that never leaves it,
# and the matching public key is compiled in. Default features include
# signing, which the unit tests use with a throwaway in-test key — there is
# no private key anywhere in this repository.
ed25519-dalek = "2"
# Device fingerprint (`license::fingerprint`): sha256 of the OS machine id.
# 0.10 rather than the newest so it unifies with the copy `argon2`/
# `ed25519-dalek` already pull in instead of adding a second sha2.
sha2 = "0.10"
# Licence server calls (`license::client`) — activate-license.php and
# license-status.php. TLS is configured exactly the way tauri's own
# `rustls-tls` feature does it: reqwest with `rustls-no-provider` (OS trust
# store via rustls-platform-verifier, no OpenSSL on any target) plus the
# `rustls` crate's pure-Rust `ring` provider, installed once at startup in
# `license::client`. Deliberately NOT reqwest's plain `rustls` feature: that
# selects aws-lc-rs, a C library built with cmake, which the Android and
# Windows cross-builds don't have and don't need. Same major versions tauri
# already pulls in, so this adds no second copy of either crate.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }
# Only for `tokio::time::sleep` in the licence background loop; tauri's
# async runtime IS tokio, so this is the same crate, not a second runtime.
tokio = { version = "1", features = ["time", "rt"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
thiserror = "2"

# `rfd` (the fatal-startup-error dialog in `lib.rs`) is desktop-only because
# it has no backend implementation at all for Android or iOS —
# `FileDialogImpl`/`MessageDialogImpl` simply aren't implemented for those
# targets, a hard compile error, not a runtime one. `lib.rs`'s `run()` falls
# back to logging via `eprintln!` (reaches `adb logcat` / the Xcode console)
# on mobile instead.
#
# default-features disabled + explicit "gtk3": rfd's own defaults are
# ["xdg-portal", "wayland"], while tauri-plugin-dialog's rfd dependency
# defaults to "gtk3" — Cargo unifies features across the whole dependency
# graph, so leaving this at its defaults enables both gtk3 and xdg-portal
# on Linux at once, which rfd's build.rs treats as a hard error ("You can't
# enable both `gtk3` and `xdg-portal` features at once"). Pinning to gtk3
# here matches tauri-plugin-dialog's own default and this repo's existing
# CI dependency install (libwebkit2gtk/libgtk are already required for the
# webview itself), so it adds nothing new to the Linux build environment.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
rfd = { version = "0.16", default-features = false, features = ["gtk3"] }
# OS-native machine id (IOPlatformUUID / /etc/machine-id / MachineGuid) for
# the licence device fingerprint. No mobile backend — `license::fingerprint`
# falls back to a per-install random id on Android and a Keychain-held one
# on iOS.
machine-uid = "0.6"

# macOS/Linux desktop printer transport: raw USB. Gated to exactly those two
# (so "not Android, not Windows, not iOS") — Android is excluded for the libusb/permission
# reasons below; Windows is excluded because a USB thermal printer with an
# installed driver has that driver's own service (usbprint.sys) bound to the
# device's Printer-class interface, which blocks libusb/WinUSB from ever
# claiming it — this is *the* reason Windows never found an installed
# printer here (see `printer::windows_spool`'s module doc comment for the
# real fix: go through the Print Spooler, the way every other Windows
# application drives a printer, instead of raw USB at all). "vendored"
# builds libusb from source instead of requiring it preinstalled on the dev
# machine (e.g. `brew install libusb` on macOS).
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
rusb = { version = "0.9", features = ["vendored"] }

# Android printer transport: Bluetooth Classic (SPP), via direct JNI calls
# to the framework's own android.bluetooth classes — see
# printer/android_bt.rs's doc comment for how it gets a JavaVM/Context
# without any cooperation from Tauri/tao (their own JNI plumbing is
# `pub(crate)`-sealed, and `ndk-context` — the usual mechanism for this in a
# winit-family app — turned out not to be initialized in this Tauri version's
# Android runtime at all). `jni` is pinned to the version already in the
# dependency tree (pulled in transitively by tauri's Android runtime) so
# this doesn't drag in a second copy.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
# The licence client's TLS roots on Android (`license::client::with_bundled_roots`):
# Mozilla's set compiled in, instead of the OS verifier, which failed on real
# phones. Already in the tree (a rustls-platform-verifier dependency).
webpki-root-certs = "1"

# iOS: App Store purchases + Sign in with Apple (a local Tauri plugin whose
# Swift half lives in plugins/storekit/ios — see `iap.rs`), and the Keychain,
# which holds the licence device id so it survives an app reinstall
# (`license::fingerprint`). security-framework is already in the tree on
# Apple targets via reqwest's TLS verifier, so this adds no new copy.
[target.'cfg(target_os = "ios")'.dependencies]
tauri-plugin-storekit = { path = "plugins/storekit" }
security-framework = "3"

[dev-dependencies]
# So `license::client`'s live test can exercise the Android TLS setup on a desktop.
webpki-root-certs = "1"

# Windows printer transport: the Print Spooler ("winspool"), via Microsoft's
# own official Rust bindings — see `printer::windows_spool`'s module doc
# comment for why this replaces raw USB on Windows specifically.
# `Win32_Graphics_Printing` has EnumPrinters/OpenPrinter/StartDocPrinter/
# WritePrinter/etc.; `Win32_Foundation` has the shared HANDLE/BOOL/error
# types those functions use.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Win32_Graphics_Printing", "Win32_Foundation", "Win32_Graphics_Gdi"] }
