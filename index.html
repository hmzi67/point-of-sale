<!doctype html>
<!-- data-theme is set statically to the default (dark) so the very first
     paint is already themed; `src/store/themeStore.ts` overwrites it once the
     persisted preference is read from SQLite. See src/styles.css. -->
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is required for env(safe-area-inset-*) to resolve to
         anything but 0 — Android's MainActivity calls enableEdgeToEdge(), so the
         WebView already draws under the status/gesture-nav bars; without this the
         CSS side has no way to know how much to pad for them. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Diwan</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
