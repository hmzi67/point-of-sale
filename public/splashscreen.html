<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Diwan</title>
    <!--
      Desktop's native splash window (tauri.conf.json's "splashscreen"
      window; lib.rs reveals "main" once the app has painted). Plain,
      unprocessed HTML/CSS/JS — no Vite step, no framework — so it paints as
      fast as the webview can. Styles and script are separate same-origin
      files because the production CSP allows no inline code.

      Android has no secondary windows, so it never loads this file — see
      SplashGate.tsx for its in-app equivalent.
    -->
    <link rel="stylesheet" href="splashscreen.css" />
  </head>
  <body>
    <div class="backdrop" aria-hidden="true">
      <span class="glow glow--a"></span>
      <span class="glow glow--b"></span>
      <span class="grid"></span>
    </div>

    <main class="stage">
      <div class="mark">
        <span class="mark__ring" aria-hidden="true"></span>
        <img class="mark__logo" src="brand-logo.png" alt="" />
      </div>
      <h1 class="wordmark">Diwan</h1>
      <p class="tagline">Point of Sale</p>
    </main>

    <footer class="foot">
      <div class="progress" role="progressbar" aria-label="Loading Diwan"><span></span></div>
      <div class="meta">
        <span class="status">Preparing your store<span class="dots" aria-hidden="true"></span></span>
        <span class="version" id="version"></span>
      </div>
    </footer>

    <script src="splashscreen.js"></script>
  </body>
</html>
